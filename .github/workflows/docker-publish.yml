name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout
      packages: write # push to ghcr.io
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Container registry paths must be lowercase; this repository is lucideds/maiIndex.
      - name: Resolve lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests from forks get a read-only token, so they build without publishing.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # load feeds the smoke test below; push publishes the same manifest.
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-platform image: no attestation manifest, so Watchtower/Portainer
          # and old compose versions pull it without an unknown/unknown platform entry.
          provenance: false

      # The image's own HEALTHCHECK hits the same route, but this proves the published
      # port answers and that the SQLite schema initialises on a cold /data/db.
      # The container listens on $PORT (8763 by default, set in the Dockerfile) - keep
      # this in step with it or the run publishes a port nothing is bound to.
      - name: Smoke test the image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          PORT="$(docker run --rm --entrypoint sh "$IMAGE" -c 'printf %s "$PORT"')"
          echo "image listens on port ${PORT}"
          docker run --detach --rm --name mai-songs-smoke \
            --publish "${PORT}:${PORT}" \
            --env ENABLE_GITHUB_SYNC=false \
            "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://localhost:${PORT}/health" > /tmp/health.json; then
              echo "healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health did not answer within 60s"
          docker logs mai-songs-smoke
          exit 1

      - name: Stop the smoke container
        if: always()
        run: docker rm --force mai-songs-smoke || true
